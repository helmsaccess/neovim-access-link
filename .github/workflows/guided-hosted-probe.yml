name: Guided Windows runner probe

on:
  push:
    branches: [codex/guided-ci-docs]
    paths:
      - .github/workflows/guided-hosted-probe.yml
      - tests/guided/windows/probe-host.ps1

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Inspect Windows desktop and sound prerequisites
        shell: powershell
        run: .\tests\guided\windows\probe-host.ps1
