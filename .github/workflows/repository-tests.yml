name: Repository tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEOVIM_ARCHIVE: nvim-linux64.tar.gz
  NEOVIM_SHA256: 4867de01a17f6083f902f8aa5215b40b0ed3a36e83cc0293de3f11708f1f9793
  NEOVIM_URL: https://github.com/neovim/neovim/releases/download/v0.10.1/nvim-linux64.tar.gz

jobs:
  safe:
    name: Unit, package, and listener-free Lua tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Neovim
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location "$NEOVIM_URL" --output "$NEOVIM_ARCHIVE"
          echo "$NEOVIM_SHA256  $NEOVIM_ARCHIVE" | sha256sum --check -
          tar --extract --gzip --file "$NEOVIM_ARCHIVE"
          echo "$PWD/nvim-linux64/bin" >> "$GITHUB_PATH"
      - name: Run sandbox-safe tests
        run: python3 tools/run_tests.py all-safe

  ssh:
    name: Mocked SSH and Askpass tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run isolated SSH tests
        run: python3 tools/run_tests.py ssh

  socket:
    name: Disposable TUI, TCP, and Unix-socket tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Neovim
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location "$NEOVIM_URL" --output "$NEOVIM_ARCHIVE"
          echo "$NEOVIM_SHA256  $NEOVIM_ARCHIVE" | sha256sum --check -
          tar --extract --gzip --file "$NEOVIM_ARCHIVE"
          echo "$PWD/nvim-linux64/bin" >> "$GITHUB_PATH"
      - name: Run isolated socket tests
        run: python3 tools/run_tests.py socket -j 1
